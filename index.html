<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divine Pixels — PSD, Software, Plugins</title>
<meta name="description" content="PSD files, software, plugins — instant Drive link delivered to your email after payment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Noto+Sans+Telugu:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F4F1FA;
    --border:#EDE9F4;
    --ink:#101014;
    --muted:#6B7280;

    --pink:#E6157E;
    --pink-deep:#C20E68;
    --blue:#1C6FEE;
    --blue-ink:#144FB8;
    --yellow:#FFD23D;

    --g-psd:linear-gradient(135deg,#E6157E,#FF6A8E);
    --g-software:linear-gradient(135deg,#1C6FEE,#3FB6E8);
    --g-plugin:linear-gradient(135deg,#FF7A1A,#FFD23D);
    --g-other:linear-gradient(135deg,#0F9D6B,#2FC98A);
    --g-brand:linear-gradient(120deg,#E6157E 0%,#C20E68 100%);

    --success:#0EA96B;
    --danger:#E23B5B;
    --radius:14px;

    --font-display:'Unbounded','Noto Sans Telugu','Noto Sans Devanagari',sans-serif;
    --font-body:'Plus Jakarta Sans','Noto Sans Telugu','Noto Sans Devanagari',sans-serif;
    --font-mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--pink); color:#fff;}

  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 clamp(14px,4vw,24px); width:100%; box-sizing:border-box;}
  section{padding:clamp(32px,6vw,64px) 0;}

  /* ===== header ===== */
  header{
    position:sticky; top:0; z-index:50;
    background:#0D0D10;
  }
  .header-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px clamp(14px,4vw,24px); max-width:1180px; margin:0 auto; gap:12px;
    flex-wrap:wrap; box-sizing:border-box; width:100%;
  }
  .logo{
    font-family:var(--font-display); font-weight:700; font-size:17px;
    display:flex; align-items:center; gap:10px; letter-spacing:.1px;
    color:var(--yellow);
  }
  .logo-mark{
    width:34px; height:34px; border-radius:10px;
    background:var(--g-brand);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:15px; font-weight:700; color:#fff;
    box-shadow:0 6px 14px -4px rgba(230,21,126,.5);
  }
  nav.chips{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;}
  nav.chips::-webkit-scrollbar{display:none;}
  .chip{
    font-size:13.5px; font-weight:700; padding:9px 16px; border-radius:999px;
    color:#C9CAD3; white-space:nowrap; border:1.5px solid transparent;
    transition:.2s; text-transform:uppercase; letter-spacing:.3px;
  }
  .chip:hover{color:#fff; background:rgba(255,255,255,.08);}
  .chip.active{color:#0D0D10; background:var(--yellow); border-color:var(--yellow);}

  .chip-dd{position:relative;}
  .chip-dd .chip{display:flex; align-items:center; gap:5px; background:none; border:1.5px solid transparent; cursor:pointer;}
  .chip-dd .chip svg{width:11px; height:11px; transition:transform .2s; flex-shrink:0;}
  .chip-dd.open .chip svg{transform:rotate(180deg);}
  .chip-dd.open .chip{color:#fff; background:rgba(255,255,255,.08);}
  .chip-menu{
    position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%);
    min-width:200px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px;
    box-shadow:0 16px 32px -12px rgba(21,15,39,.4); padding:6px;
    display:none; flex-direction:column; gap:2px; z-index:50; max-height:280px; overflow-y:auto;
  }
  .chip-dd.open .chip-menu{display:flex;}
  .chip-menu-item{
    text-align:left; background:none; border:none; padding:9px 12px; border-radius:8px;
    font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap;
  }
  .chip-menu-item:hover{background:var(--surface-2);}
  .chip-menu-item.active{background:var(--pink); color:#fff; font-weight:700;}

  /* ===== cover banner (big logo lockup, like reference) ===== */
  .cover{
    background:#FFFFFF;
    padding:0;
    text-align:center;
    position:relative;
    overflow:visible;
    border-bottom:1px solid var(--border);
  }
  .cover-inner{position:relative; z-index:2; max-width:none; margin:0 auto;}
  .cover-logo{
    font-family:var(--font-display); font-weight:800;
    font-size:clamp(38px,7vw,72px); line-height:1.02; letter-spacing:-1px;
    background:var(--g-brand); -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:14px;
  }
  .cover-logo-img{
    width:100%; max-width:none; height:auto; margin:0 auto; display:block;
  }
  .cover-tag{color:var(--muted); font-size:16px; font-weight:600; max-width:520px; margin:0 auto 26px;}
  .hero-tag{
    font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--pink);
    text-transform:uppercase; letter-spacing:1.5px; margin-bottom:16px;
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface-2); padding:6px 14px; border-radius:999px;
    border:1px solid var(--border);
  }
  .hero-tag::before{content:'✦'; color:var(--pink);}
  .hero-steps{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}
  .step-pill{
    display:flex; align-items:center; gap:10px; background:var(--surface-2);
    border:1.5px solid var(--border); border-radius:999px; padding:8px 16px 8px 8px;
    font-size:13px; font-weight:700; color:var(--ink);
  }
  .step-num{
    width:24px; height:24px; border-radius:50%; background:var(--blue);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; color:#fff; flex-shrink:0; font-weight:700;
  }

  /* floating stickers — signature element */
  .stickers{
    position:absolute; top:10px; right:6%; width:280px; height:260px;
    display:none;
  }
  .sticker{
    position:absolute; font-family:var(--font-mono); font-weight:700; font-size:12.5px;
    color:#fff; padding:7px 13px; border-radius:9px; letter-spacing:.5px;
    box-shadow:0 10px 24px -8px rgba(21,15,39,.35);
  }
  .sticker.s1{background:var(--g-psd); top:0px; right:80px; transform:rotate(-8deg);}
  .sticker.s2{background:var(--g-software); top:70px; right:-10px; transform:rotate(6deg);}
  .sticker.s3{background:var(--g-plugin); top:150px; right:110px; transform:rotate(-4deg);}
  .sticker.s4{background:var(--g-other); top:200px; right:10px; transform:rotate(9deg);}
  @media(min-width:920px){ .stickers{display:block;} }

  /* ===== section headers ===== */
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:26px; gap:16px; flex-wrap:wrap;
  }
  .section-title{
    font-family:var(--font-display); font-weight:600; font-size:22px;
    display:flex; align-items:center; gap:12px;
  }
  .section-title .dot{
    width:12px; height:12px; border-radius:4px; display:inline-block; flex-shrink:0;
  }
  .section-sub{color:var(--muted); font-size:14px; font-weight:600;}

  /* ===== subcategory dropdown ===== */
  .subcat-dd{position:relative;}
  .subcat-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1.5px solid var(--border); color:var(--ink);
    font-size:13px; font-weight:700; padding:9px 14px; border-radius:999px;
    transition:.15s;
  }
  .subcat-btn:hover{border-color:var(--pink);}
  .subcat-btn svg{transition:transform .2s; flex-shrink:0;}
  .subcat-dd.open .subcat-btn svg{transform:rotate(180deg);}
  .subcat-dd.open .subcat-btn{border-color:var(--pink); color:var(--pink);}
  .subcat-menu{
    position:absolute; top:calc(100% + 8px); right:0; min-width:190px;
    background:var(--surface); border:1.5px solid var(--border); border-radius:12px;
    box-shadow:0 16px 32px -12px rgba(21,15,39,.22); padding:6px;
    display:none; flex-direction:column; gap:2px; z-index:20; max-height:280px; overflow-y:auto;
  }
  .subcat-dd.open .subcat-menu{display:flex;}
  .subcat-item{
    text-align:left; background:none; border:none; padding:9px 12px; border-radius:8px;
    font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap;
  }
  .subcat-item:hover{background:var(--surface-2);}
  .subcat-item.active{background:var(--pink); color:#fff; font-weight:700;}

  /* ===== product grid ===== */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));
    gap:18px;
  }
  .card{
    background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; transition:.22s;
    position:relative;
  }
  .card:hover{transform:translateY(-4px); box-shadow:0 16px 32px -12px rgba(21,15,39,.18);}
  .card-media{
    aspect-ratio:16/10; background:var(--surface-2); position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .card-media img{width:100%; height:100%; object-fit:cover;}
  .card-media svg{width:46px; height:46px; opacity:.55;}
  .new-badge{
    position:absolute; top:10px; left:10px; background:var(--ink);
    color:#fff; font-size:10.5px; font-weight:700; font-family:var(--font-mono);
    padding:4px 9px; border-radius:7px; letter-spacing:.4px;
  }
  .filetype-tag{
    position:absolute; top:8px; right:8px; font-family:var(--font-mono);
    font-size:10.5px; font-weight:700; padding:5px 9px; border-radius:8px;
    color:#fff; letter-spacing:.4px; transform:rotate(-3deg);
    box-shadow:0 6px 14px -6px rgba(21,15,39,.4);
  }
  .card-eyebrow{font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--pink);}
  .card-body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-name{font-weight:700; font-size:15.5px; line-height:1.35; font-family:var(--font-display); letter-spacing:-.2px;}
  .card-desc{color:var(--muted); font-size:13px; line-height:1.5; flex:1; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-footer{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .price{font-family:var(--font-mono); font-weight:700; font-size:16px;}
  .price::before{content:'₹';color:var(--muted); font-size:13px; margin-right:1px;}
  .buy-btn{
    background:var(--blue); color:#fff; border:none; border-radius:10px;
    padding:9px 16px; font-size:13.5px; font-weight:700; transition:.15s;
  }
  .buy-btn:hover{background:var(--blue-ink); transform:scale(1.04);}

  .empty-msg, .loading-msg{color:var(--muted); font-size:14px; padding:20px 0; font-weight:600;}

  /* ===== modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(21,15,39,.55); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface); border:1.5px solid var(--border); border-radius:22px;
    width:100%; max-width:400px; padding:28px; position:relative;
    box-shadow:0 30px 60px -20px rgba(21,15,39,.4);
  }
  .modal-close{
    position:absolute; top:14px; right:14px; background:var(--surface-2); border:none;
    width:30px; height:30px; border-radius:50%; color:var(--muted); font-size:16px; font-weight:700;
  }
  .modal h3{font-family:var(--font-display); font-size:18px; margin-bottom:4px;}
  .modal .modal-price{
    font-family:var(--font-mono); font-size:22px; font-weight:700; margin:14px 0 18px;
    background:var(--g-brand); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .modal .modal-price::before{content:'₹'; font-size:16px;}
  label{font-size:13px; color:var(--muted); font-weight:700; display:block; margin-bottom:6px;}
  input[type=email]{
    width:100%; background:var(--surface-2); border:1.5px solid var(--border); color:var(--ink);
    padding:12px 13px; border-radius:11px; font-size:14px; margin-bottom:16px; outline:none; font-weight:600;
  }
  input[type=email]:focus{border-color:var(--blue);}
  .pay-btn{
    width:100%; background:var(--g-brand); color:#fff; border:none; padding:14px; border-radius:12px;
    font-size:15px; font-weight:700; font-family:var(--font-display); letter-spacing:.2px;
  }
  .pay-btn:disabled{opacity:.55; cursor:not-allowed;}
  .modal-msg{font-size:13.5px; margin-top:12px; padding:11px 13px; border-radius:10px; display:none; line-height:1.5; font-weight:600;}
  .modal-msg.show{display:block;}
  .modal-msg.success{background:rgba(14,169,107,.12); color:var(--success);}
  .modal-msg.error{background:rgba(226,59,91,.1); color:var(--danger);}

  footer{border-top:1px solid var(--border); padding:30px 0 36px; margin-top:20px;}
  .footer-inner{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
  .footer-inner p{color:var(--muted); font-size:13px; font-weight:600;}

  /* ===== language switcher ===== */
  .lang-switch{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding-top:18px; border-top:1px solid var(--border);
  }
  .lang-label{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-right:4px;}
  .lang-btn{
    background:var(--surface-2); border:1.5px solid var(--border); color:var(--muted);
    font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; transition:.15s;
  }
  .lang-btn:hover{color:var(--ink);}
  .lang-btn.active{background:var(--pink); border-color:var(--pink); color:#fff;}

  @media(max-width:640px){
    .header-inner{flex-wrap:wrap;}
    .cover{padding:28px 16px 24px;}
    section{padding:32px 0;}
    .card-name{font-size:14.5px;}
    .buy-btn{padding:10px 14px; font-size:13px;}
    .step-pill{font-size:12px; padding:7px 14px 7px 7px;}
  }
  @media(max-width:420px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr)); gap:12px;}
    .cover-logo-img{max-width:100%;}
    .logo{font-size:15px;}
    .chip{font-size:12px; padding:8px 12px;}
    .modal{padding:20px;}
  }
  @media(min-width:1400px){
    .wrap{max-width:1320px;}
  }
  /* Ensure tap targets stay comfortable on touch devices */
  .buy-btn, .pay-btn, .chip, .lang-btn, .modal-close{
    min-height:40px; display:inline-flex; align-items:center; justify-content:center;
  }
</style>
</head>

let CURRENT_LANG = localStorage.getItem('dp_lang') || 'en';

  return (I18N[CURRENT_LANG] && I18N[CURRENT_LANG][key]) || I18N.en[key] || key;
}

function setLanguage(lang) {
  CURRENT_LANG = lang;
  try { localStorage.setItem('dp_lang', lang); } catch(e) {}
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  applyStaticTranslations();
  renderAll();
}

function applyStaticTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
}

function getFallbackProducts() {
  return STATIC_PRODUCTS.map(p => ({
    id: p.id,
    name: p.name,
    category: FALLBACK_CAT_MAP[p.cat] || "Other",
    subcategory: p.subcat,
    price: p.price,
    image: p.img,
    description: p.desc,
    dateAdded: p.date
  }));
}

async function loadProducts() {
  try {
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=products`);
    const data = await res.json();
    const list = Array.isArray(data) ? data : [];
    ALL_PRODUCTS = list.length ? list : getFallbackProducts();
    renderAll();
  } catch (err) {
    // Backend unreachable / not configured yet — show the static catalog instead.
    ALL_PRODUCTS = getFallbackProducts();
    renderAll();
    console.error(err);
  }
}

function isNew(dateAdded) {
  if (!dateAdded) return false;
  const days = (Date.now() - new Date(dateAdded).getTime()) / 86400000;
  return days <= 14;
}

function cardHTML(p) {
  const cat = CATEGORY_MAP[p.category] || 'other';
  const grad = CATEGORY_GRADIENT[cat];
  const media = p.image
    ? `<img src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy">`
    : ICONS[cat](ICON_COLOR[cat]);
  return `
    <div class="card">
      <div style="height:5px; width:100%; background:${grad};"></div>
      <div class="card-media">
        ${media}
        ${isNew(p.dateAdded) ? `<span class="new-badge">${t('new_badge')}</span>` : ''}
        <span class="filetype-tag" style="background:${grad}">${FILETYPE_LABEL[cat]}</span>
      </div>
      <div class="card-body">
        <div class="card-eyebrow">${escapeHtml(p.category)}</div>
        <div class="card-name">${escapeHtml(p.name)}</div>
        <div class="card-desc">${escapeHtml(p.description || '')}</div>
        <div class="card-footer">
          <span class="price">${Number(p.price).toLocaleString('en-IN')}</span>
          <button class="buy-btn" onclick="openBuyModal('${p.id}')">${t('buy_now')}</button>
        </div>
      </div>
    </div>`;
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderAll() {
  const grids = { psd: [], software: [], plugin: [], other: [] };
  ALL_PRODUCTS.forEach(p => {
    const cat = CATEGORY_MAP[p.category] || 'other';
    grids[cat].push(p);
  });

  Object.keys(grids).forEach(cat => {
    buildSubcatDropdown(cat, grids[cat]);
    buildNavDropdown(cat, grids[cat]);
    const active = ACTIVE_FILTERS[cat];
    const items = active === 'all'
      ? grids[cat]
      : grids[cat].filter(p => getSubcat(p) === active);

    const el = document.getElementById('grid-' + cat);
    el.innerHTML = items.length
      ? items.map(cardHTML).join('')
      : `<p class="empty-msg">${t('empty')}</p>`;
  });

  const newest = [...ALL_PRODUCTS]
    .sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded))
    .slice(0, 8);
  document.getElementById('grid-new').innerHTML = newest.length
    ? newest.map(cardHTML).join('')
    : `<p class="empty-msg">${t('empty')}</p>`;
}

function buildSubcatDropdown(cat, items) {

  const dd = document.getElementById('dd-' + cat);
  if (!menu || !label || !dd) return;

  const subcats = [...new Set(items.map(getSubcat).filter(Boolean))];

  if (!subcats.length) {
    dd.style.display = 'none';
    return;
  }
  dd.style.display = '';

  if (ACTIVE_FILTERS[cat] !== 'all' && !subcats.includes(ACTIVE_FILTERS[cat])) {
    ACTIVE_FILTERS[cat] = 'all';
  }

  const allActive = ACTIVE_FILTERS[cat] === 'all';
  let html = `<button type="button" class="subcat-item${allActive ? ' active' : ''}" onclick="selectSubcat('${cat}','all')">${t('filter_all')}</button>`;
  subcats.forEach(sc => {
    const isActive = ACTIVE_FILTERS[cat] === sc;
    html += `<button type="button" class="subcat-item${isActive ? ' active' : ''}" onclick="selectSubcat('${cat}','${escapeHtml(sc).replace(/'/g,"\\'")}')">${escapeHtml(sc)}</button>`;
  });
  menu.innerHTML = html;
  label.textContent = allActive ? t('filter_all') : ACTIVE_FILTERS[cat];
}

function toggleDropdown(cat) {
  const dd = document.getElementById('dd-' + cat);
  const isOpen = dd.classList.contains('open');
  document.querySelectorAll('.subcat-dd.open, .chip-dd.open').forEach(el => el.classList.remove('open'));
  if (!isOpen) dd.classList.add('open');
}

function selectSubcat(cat, value) {
  ACTIVE_FILTERS[cat] = value;
  document.getElementById('dd-' + cat).classList.remove('open');
  renderAll();
}

function buildNavDropdown(cat, items) {
  const menu = document.getElementById('navdd-' + cat + '-menu');
  const dd = document.getElementById('navdd-' + cat);
  if (!menu || !dd) return;

  const subcats = [...new Set(items.map(getSubcat).filter(Boolean))];
  if (!subcats.length) {
    menu.innerHTML = '';
    dd.dataset.hasSubcats = 'false';
    return;
  }
  dd.dataset.hasSubcats = 'true';

  const allActive = ACTIVE_FILTERS[cat] === 'all';
  let html = `<button type="button" class="chip-menu-item${allActive ? ' active' : ''}" onclick="navSelectSubcat('${cat}','all')">${t('filter_all')}</button>`;
  subcats.forEach(sc => {
    const isActive = ACTIVE_FILTERS[cat] === sc;
    html += `<button type="button" class="chip-menu-item${isActive ? ' active' : ''}" onclick="navSelectSubcat('${cat}','${escapeHtml(sc).replace(/'/g,"\\'")}')">${escapeHtml(sc)}</button>`;
  });
  menu.innerHTML = html;
}

function handleNavChipClick(evt, cat) {
  const dd = document.getElementById('navdd-' + cat);
  const hasSubcats = dd && dd.dataset.hasSubcats === 'true';

  if (!hasSubcats) return true; // no subcats: normal anchor scroll

  evt.preventDefault();
  const isOpen = dd.classList.contains('open');
  document.querySelectorAll('.subcat-dd.open, .chip-dd.open').forEach(el => el.classList.remove('open'));
  if (!isOpen) dd.classList.add('open');
  return false;
}

function navSelectSubcat(cat, value) {
  ACTIVE_FILTERS[cat] = value;
  document.getElementById('navdd-' + cat).classList.remove('open');
  renderAll();
  const section = document.getElementById(cat);
  if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.addEventListener('click', e => {
  if (!e.target.closest('.subcat-dd') && !e.target.closest('.chip-dd')) {
    document.querySelectorAll('.subcat-dd.open, .chip-dd.open').forEach(el => el.classList.remove('open'));
  }
});

function openBuyModal(productId) {
  SELECTED_PRODUCT = ALL_PRODUCTS.find(p => p.id === productId);
  if (!SELECTED_PRODUCT) return;
  document.getElementById('modalProductName').textContent = SELECTED_PRODUCT.name;
  document.getElementById('modalProductDesc').textContent = SELECTED_PRODUCT.description || '';
  document.getElementById('modalProductPrice').textContent =
    Number(SELECTED_PRODUCT.price).toLocaleString('en-IN');
  document.getElementById('buyerEmail').value = '';
  const msg = document.getElementById('modalMsg');
  msg.className = 'modal-msg';
  msg.textContent = '';
  document.getElementById('payBtn').disabled = false;
  document.getElementById('payBtn').style.display = 'block';
  document.getElementById('payBtn').textContent = t('pay_now');
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});

function showModalMsg(text, type) {
  const msg = document.getElementById('modalMsg');
  msg.textContent = text;
  msg.className = 'modal-msg show ' + type;
}

document.getElementById('payBtn').addEventListener('click', async () => {
  const email = document.getElementById('buyerEmail').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showModalMsg(t('invalid_email'), 'error');
    return;
  }
  const payBtn = document.getElementById('payBtn');
  payBtn.disabled = true;
  payBtn.textContent = t('processing');
  showModalMsg('', '');

  try {
    const orderRes = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'createOrder',
        productId: SELECTED_PRODUCT.id,
        email: email
      })
    });
    const order = await orderRes.json();
    if (!order.success) {
      showModalMsg(order.error || t('order_failed'), 'error');
      resetPayBtn();
      return;
    }

    const rzp = new Razorpay({
      key: order.keyId,
      amount: order.amount,
      currency: order.currency,
      name: 'Divine Pixels',
      description: order.productName,
      order_id: order.orderId,
      prefill: { email: email },
      theme: { color: '#E6157E' },
      handler: async function (response) {
        payBtn.textContent = t('verifying');
        try {
          const verifyRes = await fetch(CONFIG.APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'verifyPayment',
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
              productId: SELECTED_PRODUCT.id,
              email: email
            })
          });
          const verify = await verifyRes.json();
          if (verify.success) {
            showModalMsg(`${t('payment_success')} ${email}. ${t('payment_success_note')}`, 'success');
            payBtn.style.display = 'none';
          } else {
            showModalMsg((verify.error || t('verify_failed')) + ' support@divinepixels.in', 'error');
            resetPayBtn();
          }
        } catch (err) {
          showModalMsg(t('verify_error') + ' support@divinepixels.in', 'error');
          resetPayBtn();
        }
      },
      modal: {
        ondismiss: function () { resetPayBtn(); }
      }
    });
    rzp.on('payment.failed', function () {
      showModalMsg(t('payment_failed'), 'error');
      resetPayBtn();
    });
    rzp.open();
    payBtn.textContent = t('pay_now');
    payBtn.disabled = false;
  } catch (err) {
    showModalMsg(t('generic_error'), 'error');
    resetPayBtn();
    console.error(err);
  }
});

function resetPayBtn() {
  const payBtn = document.getElementById('payBtn');
  payBtn.disabled = false;
  payBtn.textContent = t('pay_now');
}

/* active chip on scroll */
const sections = ['new', 'psd', 'software', 'plugin', 'other'].map(id => document.getElementById(id));
const chips = document.querySelectorAll('.chip');
const io = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      chips.forEach(c => c.classList.toggle('active', c.dataset.target === entry.target.id));
    }
  });
}, { rootMargin: '-40% 0px -50% 0px' });
sections.forEach(s => io.observe(s));

document.getElementById('year').textContent = new Date().getFullYear();
document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === CURRENT_LANG));
document.documentElement.lang = CURRENT_LANG;
applyStaticTranslations();
loadProducts();
</script>
</body>
</html>
